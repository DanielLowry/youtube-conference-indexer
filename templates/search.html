{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Search</h1>

<form hx-get="/search" hx-target="#search-results" hx-swap="innerHTML">
    <div class="mb-4">
        <label for="query" class="block text-sm font-medium text-gray-700">Search Query</label>
        <input type="search" name="q" id="query" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
            placeholder="Search for videos...">
    </div>
</form>

<div id="search-results">
    {% if videos %}
        {% include "video-list.html" %}
    {% else %}
        <div class="p-3 rounded bg-yellow-50 text-yellow-800 border border-yellow-200">
            No results yet. Make sure you have pinned playlists and run a sync, or refine your search.
        </div>
    {% endif %}
</div>
{% endblock %}
