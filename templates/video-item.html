<div class="bg-white p-4 rounded shadow-md" id="video-{{ video.id }}">
    <div class="flex items-start justify-between">
        <div>
            <h2 class="text-xl font-bold">{{ video.title }}</h2>
            <p class="text-gray-600">{{ video.channel_title }} - {{ video.published_at.strftime('%Y-%m-%d') }} - {{ video.duration_seconds // 60 }} min</p>
        </div>
        <span class="px-2 py-1 text-xs font-semibold text-white bg-blue-500 rounded-full">
            {{ video.state.status }}
        </span>
    </div>
    <p class="mt-2">{{ video.description[:300] }}...</p>

    <div class="mt-3 flex flex-wrap gap-2 items-center">
        {% for tag in video.tags %}
        <form
            hx-delete="/videos/{{ video.id }}/tags"
            hx-target="#video-{{ video.id }}"
            hx-swap="outerHTML"
            hx-queue="last"
            hx-sync="this:abort"
            class="inline"
        >
            <input type="hidden" name="tag" value="{{ tag.name }}">
            <button type="submit" class="px-2 py-1 text-xs font-semibold text-white bg-gray-700 rounded-full hover:bg-gray-800">
                {{ tag.name }} ✕
            </button>
        </form>
        {% endfor %}
        <form
            hx-post="/videos/{{ video.id }}/tags"
            hx-target="#video-{{ video.id }}"
            hx-swap="outerHTML"
            hx-queue="last"
            hx-sync="this:abort"
            class="flex items-center space-x-1"
        >
            <input name="tag" placeholder="Add tag" class="border rounded px-2 py-1 text-xs" required>
            <button type="submit" class="px-2 py-1 text-xs font-semibold text-white bg-gray-600 rounded hover:bg-gray-700">Add</button>
        </form>
    </div>

    <div class="mt-3">
        <form
            hx-post="/videos/{{ video.id }}/status"
            hx-target="#video-{{ video.id }}"
            hx-swap="outerHTML"
            hx-queue="last"
            hx-sync="this:abort"
            class="grid grid-cols-1 md:grid-cols-4 gap-2 items-end"
        >
            <div>
                <label class="block text-xs text-gray-700">Status</label>
                <select name="status" class="border rounded w-full px-2 py-1 text-sm">
                    {% for opt in ["queued","watching","done","skipped"] %}
                    <option value="{{ opt }}" {% if video.state.status == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-700">Score</label>
                <input type="number" name="score" min="1" max="5" value="{{ video.state.score or '' }}" class="border rounded w-full px-2 py-1 text-sm">
            </div>
            <div class="md:col-span-2">
                <label class="block text-xs text-gray-700">Notes</label>
                <input type="text" name="notes" value="{{ video.state.notes or '' }}" class="border rounded w-full px-2 py-1 text-sm">
            </div>
            <div>
                <button type="submit" class="px-3 py-2 text-sm font-semibold text-white bg-indigo-600 rounded hover:bg-indigo-700 w-full">Update</button>
            </div>
        </form>
    </div>
</div>
