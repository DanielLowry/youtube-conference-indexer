<div class="space-y-4">
    {% for video in videos %}
    <div class="bg-white p-4 rounded shadow-md">
        <h2 class="text-xl font-bold">{{ video.title }}</h2>
        <p class="text-gray-600">{{ video.channel_title }} - {{ video.published_at.strftime('%Y-%m-%d') }} - {{ video.duration_seconds // 60 }} min</p>
        <p class="mt-2">{{ video.description[:300] }}...</p>
        <div class="mt-2">
            <span class="px-2 py-1 text-xs font-semibold text-white bg-blue-500 rounded-full">
                {{ video.state.status }}
            </span>
        </div>
    </div>
    {% else %}
    <p>No videos found.</p>
    {% endfor %}
</div>
