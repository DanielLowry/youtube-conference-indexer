{% set pstatus = playlist_status.get(playlist.id) if playlist_status is defined else None %}
{% set state = pstatus.state if pstatus else 'idle' %}
{% set disable_pin = state in ['queued','fetching'] %}
<li class="flex flex-col space-y-1" id="playlist-{{ playlist.id }}" x-show="!filter || '{{ playlist.title | lower }}'.includes(filter.toLowerCase())" x-cloak>
    <div class="flex items-center justify-between">
        <span>{{ playlist.title }}</span>
        <button
            {% if disable_pin %}disabled class="text-gray-300 cursor-not-allowed"{% else %}class="{% if playlist.pinned %}text-yellow-500{% else %}text-gray-400{% endif %} hover:text-gray-600"{% endif %}
            hx-post="/playlists/{{ playlist.id }}/pin"
            hx-target="#playlist-{{ playlist.id }}"
            hx-swap="outerHTML"
        >
            {% if playlist.pinned %}
            <!-- Heroicon name: solid/star -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
            </svg>
            {% else %}
            <!-- Heroicon name: outline/star -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.518 4.674a1 1 0 00.95.69h4.903c.969 0 1.371 1.24.588 1.81l-3.968 2.88a1 1 0 00-.364 1.118l1.518 4.674c.3.921-.755 1.688-1.539 1.118l-3.968-2.88a1 1 0 00-1.175 0l-3.968 2.88c-.784.57-1.839-.197-1.539-1.118l1.518-4.674a1 1 0 00-.364-1.118L2.043 9.1c-.783-.57-.38-1.81.588-1.81h4.903a1 1 0 00.95-.69L11.049 2.927z" />
            </svg>
            {% endif %}
        </button>
    </div>
    <div
        id="playlist-status-{{ playlist.id }}"
        hx-get="/playlists/{{ playlist.id }}/status"
        hx-trigger="{% if state in ['queued','fetching'] %}load, every 1s{% else %}load{% endif %}"
        hx-swap="outerHTML"
        class="text-xs text-gray-600"
    ></div>
</li>
