name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Run tests
        env:
          YOUTUBE_API_KEY: test-key
          DATABASE_URL: sqlite:///$(pwd)/data/ci.db
        run: |
          mkdir -p data
          uv run pytest
